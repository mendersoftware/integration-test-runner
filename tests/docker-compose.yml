services:

  integration-test-runner:
    build:
      context: ..
      dockerfile: Dockerfile.acceptance
    ports:
      - "8080:8080"
    environment:
      DRY_RUN: 1
      DRY_RUN_NON_ORG_MEMBERS: Junglebobo
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITLAB_BASE_URL: https://gitlab.com/api/v4
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      INTEGRATION_TEST_RUNNER_LOG_LEVEL: debug
      # Every repository used by a payload must be listed, otherwise its events
      # are ignored and the golden file collapses to one "ignoring event" line.
      SYNC_REPOS_LIST: integration,mender,mender-configure-module,mender-docs,mender-qa,website,workflows,workflows-enterprise
    volumes:
      - ".:/testing"
    networks:
      acceptance-tests:
        aliases:
          - integration-test-runner

networks:
    acceptance-tests:
