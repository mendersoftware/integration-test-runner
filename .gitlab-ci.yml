variables:
  MULTIPLATFORM_BUILD: "true"
  MULTIPLATFORM_PLATFORMS: "linux/amd64"
  DOCKER_REPOSITORY: mendersoftware/integration-test-runner
  DOCKER_VERSION: "29.7"
  DOCKER_HOST:
    value: "tcp://docker:2376"
    description: "Required to run dind inside k8s runners with TLS"
  DOCKER_TLS_CERTDIR:
    value: "/certs"
    description: "The cert dir inside the gitlab runner. Don't change this."
  DOCKER_TLS_VERIFY:
    value: 1
    description: "Enable TLS verification for docker in dind"
  DOCKER_CERT_PATH:
    value: "$DOCKER_TLS_CERTDIR/client"
    description: "Used for docker entrypoints. See https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125"
  GO_VERSION: "1.25"

stages:
  - test
  - build
  - publish
  - sync

# excludes non multiplatform build job
build:docker:
  rules:
    - when: never

# excludes non multiplatform build job
publish:image:
  rules:
    - when: never

# excludes non multiplatform build job
publish:image:mender:
  rules:
    - when: never

# excludes non multiplatform build job
publish:image:saas:
  rules:
    - when: never

include:
  - project: Northern.tech/Mender/mendertesting
    file:
      - qa-common/runner.yml
      - qa-common/retry.yml
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-golang-lint.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-golang-unittests-v2.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-docker-build.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-github-status-updates.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-docker-deploy.yml'
  - component: gitlab.com/Northern.tech/Mender/mendertesting/publish-codecov@master
    inputs:
      coverage_file: ./tests/coverage-acceptance.txt
      flag: acceptance
      needs_job: test:acceptance_tests

default:
  tags: !reference [.qa-common-default-runner, tags]
  retry: !reference [.qa-common-default-retry, retry]


test:unit:
  before_script:
    - !reference [.qa-common-network-git-clone-retry, before_script]
    - !reference [.qa-common-network-go-retry, before_script]
    - apt update && apt install -yq $(cat deb-requirements.txt)
    - pip install PyGithub --break-system-packages

    - git config --global user.email test@example.com
    - git config --global user.name  mendertester

    # Clone this for use in certain tests.
    - git clone --depth 1 https://github.com/mendersoftware/integration
    - export INTEGRATION_DIRECTORY="$(realpath integration)"


test:acceptance_tests:
  stage: test
  tags:
    - hetzner-amd-beefy
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/tiangolo/docker-with-compose
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - make acceptance-testing-build
    - make acceptance-testing-up
    - sh -c "sleep 30"
    - make acceptance-testing-run
  after_script:
    - make acceptance-testing-logs
    - make acceptance-testing-down
  artifacts:
    expire_in: 2w
    paths:
      - tests/coverage-acceptance.txt
    when: always

publish:tests:
  rules:
    - if: $CI_COMMIT_BRANCH !~ /^saas-[a-zA-Z0-9.]+$/

sync:image:
  dependencies:
    - publish:image-multiplatform
  variables:
    TARGET_MANIFEST_FILE: "kubernetes/mender-test-runner/test-runner-deployment.yaml,kubernetes/cfengine-repos-sync/repos-sync-cfengine-com-deployment.yaml,kubernetes/northerntechhq-repos-sync/repos-sync-northerntechhq-deployment.yaml"
